# ── بروفة منزلية: كاميرا Tapo واحدة + كشف على المعالج (CPU) ──
# تعمل على Windows (Docker Desktop/WSL2) أو ماك أو أي لينكس — لا تتطلب iGPU.
# التشغيل من مجلد edge:
#   docker compose -f docker-compose.home.yml up -d --build
# نسخة الفرع الإنتاجية (3 كاميرات + OpenVINO iGPU) تبقى docker-compose.yml.
services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.17.0
    container_name: abyad-frigate
    restart: unless-stopped
    shm_size: '128mb'
    volumes:
      - ./frigate/config.home.yml:/config/config.yml:ro
      - frigate-media:/media/frigate
    environment:
      FRIGATE_RTSP_USER: ${RTSP_USER}
      FRIGATE_RTSP_PASSWORD: ${RTSP_PASSWORD}
      FRIGATE_CAM_PROCESSING_IP: ${CAM_PROCESSING_IP}
    ports:
      - '127.0.0.1:5000:5000' # واجهة Frigate: http://localhost:5000
    depends_on:
      - mqtt

  mqtt:
    image: eclipse-mosquitto:2
    container_name: abyad-mqtt
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    ports:
      - '127.0.0.1:1883:1883'

  bridge:
    build: ./bridge
    container_name: abyad-bridge
    restart: unless-stopped
    volumes:
      - ./bridge/config.home.yaml:/app/config.yaml:ro
      - bridge-data:/data
    environment:
      CLOUD_BASE_URL: ${CLOUD_BASE_URL}
      CLOUD_DEVICE_TOKEN: ${CLOUD_DEVICE_TOKEN}
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      FRIGATE_BASE_URL: http://frigate:5000
      OUTBOX_DB: /data/outbox.db
      BRIDGE_VERSION: '1.0.0-home'
    depends_on:
      - frigate
      - mqtt

volumes:
  frigate-media:
  mqtt-data:
  bridge-data:
