# ── إعداد Frigate للبروفة المنزلية: كاميرا Tapo C212 واحدة، كشف CPU ──
# المنطقة processing_area تغطي كامل الإطار — أي جسم في الصورة يُعد داخل المنطقة.
# نفس حراس الخصوصية: لا صوت، لا وجوه.

mqtt:
  host: mqtt
  port: 1883
  topic_prefix: frigate
  client_id: frigate

# ── إعادة بث go2rtc (مدمج في Frigate) ──
# اتصال واحد فقط بالكاميرا (كاميرات Tapo تحدّ الجلسات المتزامنة)؛
# ffmpeg يقرأ من إعادة البث المحلية — أثبت استقرارًا مع Tapo من الاتصال المباشر.
go2rtc:
  streams:
    cam_processing:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_CAM_PROCESSING_IP}:554/stream1

detectors:
  ov:
    type: openvino
    device: CPU # بروفة منزلية — يعمل على أي معالج x86 دون iGPU

# نموذج OpenVINO الافتراضي المضمّن في الحاوية (SSDLite MobileNet v2)
# الكتلة كاملة كما في وثائق 0.17 (object_detectors → MobileNet v2 Config)
model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

audio:
  enabled: false

# بنية 0.17: retain تحت record أُزيلت — الاحتفاظ عبر motion/alerts/detections
record:
  enabled: true
  motion:
    days: 2 # بروفة — لا نملأ قرص الجهاز المنزلي
  alerts:
    retain:
      days: 2
  detections:
    retain:
      days: 2

snapshots:
  enabled: true
  retain:
    default: 2

objects:
  track:
    - person
    - cup
    - bottle
    - bowl
    - sandwich
    - banana
    - apple
    - orange
    - donut
    - cake
  filters:
    person:
      min_score: 0.55
      threshold: 0.65

cameras:
  cam_processing:
    ffmpeg:
      inputs:
        # القراءة من إعادة بث go2rtc المحلية — لا اتصال مباشر ثانٍ بالكاميرا
        - path: rtsp://127.0.0.1:8554/cam_processing
          input_args: preset-rtsp-restream
          roles: [detect, record]
      output_args:
        # preset-record-generic يتضمن -an داخليًا (بلا صوت — حارس خصوصية)؛
        # إلحاق أي شيء بعد اسم الـ preset يكسر مطابقته فيُمرَّر نصًا خامًا لـ ffmpeg
        record: preset-record-generic
    detect:
      enabled: true # الافتراضي في 0.17 هو False — بدونها لا كشف إطلاقًا
      width: 1280
      height: 720
      fps: 5
    zones:
      processing_area:
        # كامل الإطار — كل ما تراه الكاميرا يقع في «منطقة المعالجة»
        coordinates: 0.0,0.0,1.0,0.0,1.0,1.0,0.0,1.0
        objects: [person, cup, bottle, bowl, sandwich, banana, apple, orange, donut, cake]
