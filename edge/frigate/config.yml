# ── إعداد Frigate 0.17 — أبيض فيجن (3 كاميرات، كاشف OpenVINO) ──
# حراس الخصوصية: لا صوت إطلاقًا (-an في كل المسارات)، لا تعرف على وجوه،
# التسجيل المحلي 14 يومًا (FR-01) (الأدلة الرسمية تُدار سحابيًا بسياسة 90 يومًا).
# بيانات RTSP تُحقن من .env عبر متغيرات FRIGATE_* — لا أسرار في هذا الملف.

mqtt:
  host: mqtt
  port: 1883
  topic_prefix: frigate
  client_id: frigate

# ── إعادة بث go2rtc (مدمج في Frigate) ──
# اتصال واحد فقط بكل كاميرا؛ ffmpeg يقرأ من إعادة البث المحلية (أثبت مع Tapo).
go2rtc:
  streams:
    cam_processing:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_CAM_PROCESSING_IP}:554/stream1
    cam_reception:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_CAM_RECEPTION_IP}:554/stream1
    cam_waste:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_CAM_WASTE_IP}:554/stream1

detectors:
  ov:
    type: openvino
    device: GPU # iGPU لمعالج N100 (وفق وثائق 0.17)

# نموذج OpenVINO الافتراضي المضمّن في الحاوية (SSDLite MobileNet v2)
# الكتلة كاملة كما في وثائق 0.17 (object_detectors → MobileNet v2 Config)
model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

# لا كشف صوتي — خصوصية (PRD §خصوصية: بلا صوت في أي مكان)
audio:
  enabled: false

# بنية 0.17: retain تحت record أُزيلت — الاحتفاظ عبر motion/alerts/detections
record:
  enabled: true
  motion:
    days: 14 # PRD FR-01: تسجيل دوار محلي 14 يومًا
  alerts:
    retain:
      days: 14
  detections:
    retain:
      days: 14

snapshots:
  enabled: true
  retain:
    default: 14

objects:
  # الأصناف المتعقبة وفق بنود §5 (شخص + أدوات أكل/شرب)
  track:
    - person
    - cup
    - bottle
    - bowl
    - sandwich
    - banana
    - apple
    - orange
    - donut
    - cake
  filters:
    person:
      min_score: 0.55
      threshold: 0.65

# ── الكاميرات الثلاث والمناطق الأربع ──
# إحداثيات المناطق أدناه قوالب مبدئية تُضبط ميدانيًا من واجهة Frigate
# (Settings → Mask/Zone editor) بعد تركيب الكاميرات، ثم تُنسخ هنا.
cameras:
  cam_processing:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam_processing
          input_args: preset-rtsp-restream
          roles: [detect, record]
      output_args:
        # preset-record-generic يتضمن -an داخليًا (بلا صوت — حارس خصوصية)
        record: preset-record-generic
    detect:
      width: 1280
      height: 720
      fps: 5
    zones:
      processing_area:
        coordinates: 0.05,0.15,0.95,0.15,0.95,0.95,0.05,0.95
        objects: [person, cup, bottle, bowl, sandwich, banana, apple, orange, donut, cake]

  cam_reception:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam_reception
          input_args: preset-rtsp-restream
          roles: [detect, record]
      output_args:
        record: preset-record-generic
    detect:
      width: 1280
      height: 720
      fps: 5
    zones:
      reception_pos:
        coordinates: 0.25,0.2,0.95,0.2,0.95,0.9,0.25,0.9
        objects: [person, cup, bottle, bowl, sandwich, banana, apple, orange, donut, cake]
      entrance:
        coordinates: 0.0,0.3,0.22,0.3,0.22,1.0,0.0,1.0
        objects: [person]

  cam_waste:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam_waste
          input_args: preset-rtsp-restream
          roles: [detect, record]
      output_args:
        record: preset-record-generic
    detect:
      width: 1280
      height: 720
      fps: 5
    zones:
      waste_point:
        coordinates: 0.1,0.25,0.9,0.25,0.9,0.95,0.1,0.95
        objects: [person]

version: '0.17-0'
